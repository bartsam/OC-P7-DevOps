name: Create GitHub release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate semantic version tag
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Build Angular artifact
        working-directory: front
        run: |
          npm ci
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Spring Boot artifact
        working-directory: back
        run: ./gradlew clean bootJar

      - name: Package release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          cp back/build/libs/*.jar "release-assets/microcrm-back-${TAG}.jar"
          (
            cd front/dist
            zip -r "../../release-assets/microcrm-front-${TAG}.zip" microcrm
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "MicroCRM ${TAG}"
