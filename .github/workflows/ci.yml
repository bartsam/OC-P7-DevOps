name: MicroCRM Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tests:
    name: Run Front-End & Back-End tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Chrome for Karma
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run unified test script
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: bash ./run-tests.sh

      - name: Publish JUnit reports
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "test-results/**/*.xml"

      - name: Upload JUnit files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload coverage reports for SonarQube
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            front/coverage/microcrm/lcov.info
            back/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error

  build:
    name: Build Front-End & Back-End
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Frontend build (Angular)
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install Front-End dependencies
        working-directory: front
        run: npm ci

      - name: Build Front-End (Angulat)
        working-directory: front
        run: npm run build

      # Backend build (Spring Boot / Gradle)
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build Back-End (Gradle)
        working-directory: back
        run: ./gradlew build

      - name: Validate Docker Compose configuration
        run: docker compose config -q

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [build, tests]
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Download coverage reports
        uses: actions/download-artifact@v7
        with:
          name: coverage-reports
          path: .

      - name: Compile Back-End classes for SonarQube
        working-directory: back
        run: ./gradlew classes

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, tests, sonar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Front-End image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: front
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/microcrm-front:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/microcrm-front:${{ github.sha }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front

      - name: Build and push Back-End image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: back
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/microcrm-back:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/microcrm-back:${{ github.sha }}
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back
