name: MicroCRM Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  tests:
    name: Run Front-End & Back-End tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Chrome for Karma
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run unified test script
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: bash ./run-tests.sh

      - name: Publish JUnit reports
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "test-results/**/*.xml"

      - name: Upload JUnit files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/**/*.xml
          if-no-files-found: warn

  build:
    name: Build Front-End & Back-End
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Frontend build (Angular)
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install Front-End dependencies
        working-directory: front
        run: npm ci

      - name: Build Front-End (Angulat)
        working-directory: front
        run: npm run build

      # Backend build (Spring Boot / Gradle)
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build Back-End (Gradle)
        working-directory: back
        run: ./gradlew build

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [build, tests]
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
