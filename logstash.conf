input {
  # Receive JSON events from Spring Boot and Caddy.
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Add common local monitoring metadata.
  mutate {
    add_field => { "environment" => "local" }
  }

  if [logger_name] {
    # Spring Boot event.
    mutate { add_field => { "service" => "microcrm-back" } }
  } else {
    # Caddy access event.
    mutate {
      add_field => { "service" => "microcrm-front" }
      uppercase => ["level"]
    }
  }
}

output {
  # Store events in daily Elasticsearch indices.
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microcrm-logs-%{+YYYY.MM.dd}"
  }

}
